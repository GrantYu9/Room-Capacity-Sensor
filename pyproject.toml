[project]
name = "room_capacity_sensor"
version = "0.1.0"
dependencies = [
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "opencv-python>=4.10,<6",
    "sounddevice>=0.5,<1",
    "soundfile>=0.13,<1",
    "psycopg>=3.3.0",
    "psycopg-binary>=3.3.0",
    "python-dotenv>=1.0.0",
    "ultralytics>=8.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-mock>=3.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
