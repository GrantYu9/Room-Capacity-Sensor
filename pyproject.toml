[project]
name = "room_capacity_sensor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<6",
    "sounddevice>=0.5,<1",
    "soundfile>=0.13,<1",
    "ultralytics>=8.4,<9"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-mock>=3.15,<4"]
legacy-send = ["psycopg[binary]>=3.3", "python-dotenv>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "interface"]

[tool.setuptools.package-data]
src = ["noise.synthetic.json"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
